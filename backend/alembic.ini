# Alembic configuration for Research Hive.
#
# Database credentials are NOT stored here: migrations/env.py builds the
# connection from the same PG* settings the application uses (.env or the
# process environment). Run from the backend/ directory:
#
#     uv run alembic upgrade head
#
# or use scripts/bootstrap_db.py, which also checks connectivity and creates
# the application schema when the credentials are allowed to.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
