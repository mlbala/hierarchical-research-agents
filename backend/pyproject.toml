[project]
name = "research-hive"
version = "0.1.0"
description = "Hierarchical multi-agent research platform that produces cited reports."
readme = "../README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20,<2",
    "anthropic>=1.13,<2",
    "beautifulsoup4>=4.15,<5",
    "certifi>=2026.7.22",
    "fastapi>=0.143,<1",
    "httpcore>=1.0.9,<2",
    "httpx>=0.28.1,<1",
    "langgraph>=1.2.14,<2",
    "lxml>=6.1,<7",
    "markdown-it-py>=4,<5",
    "openai>=3.29,<4",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "reportlab>=4.4,<5",
    "sqlalchemy[asyncio]>=2.1.4,<2.2",
    "structlog>=26.1,<27",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pypdf>=6,<7",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17,<0.18",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PL"]
ignore = [
    "PLR0913",  # agent/service functions legitimately take several keyword args
    "PLR2004",  # small numeric literals are clearer inline than as constants
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "RUF001",   # typographic quotes in prompts/fixtures are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLC0415"]
"migrations/**" = ["S608"]
"app/tools/demo.py" = ["E501"]  # fixture prose

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "db: requires the dedicated PostgreSQL test database (TEST_PG* variables)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
